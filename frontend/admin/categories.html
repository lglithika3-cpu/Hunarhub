<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container nav-content">
        <a href="dashboard.html" class="logo">HunarHub</a>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="users.html">Users</a>
            <a href="entrepreneurs.html">Entrepreneurs</a>
            <a href="categories.html">Categories</a>
            <a href="products.html">Products</a>
            <a href="services.html">Services</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Requests</a>
            <a href="reviews.html">Reviews</a>
            <a href="reports.html">Reports</a>
            <button onclick="logout()" class="btn btn-danger">Logout</button>
        </div>
    </div>
</nav>

<section class="page-header">
    <div class="container">
        <h1>Category Management</h1>
        <p>Manage marketplace categories for local businesses.</p>
    </div>
</section>

<section class="section">
    <div class="container">

        <div id="message"></div>

        <div class="card">
            <h2>Add Category</h2>

            <form id="categoryForm">

                <div class="form-group">
                    <label>Category Name</label>
                    <input
                        type="text"
                        id="categoryName"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea
                        id="categoryDescription"
                        rows="4"
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Category
                </button>

            </form>
        </div>

        <br>

        <div class="card">

            <div class="section-header">
                <div>
                    <h2>Categories</h2>
                    <p>Manage category status and information.</p>
                </div>

                <button
                    class="btn btn-primary"
                    onclick="loadCategories()"
                >
                    Refresh
                </button>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="categoriesTable">
                        <tr>
                            <td colspan="5">
                                Loading...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>
</section>

<script src="../js/app.js"></script>

<script>
async function loadCategories() {

    const table =
        document.getElementById("categoriesTable");

    try {

        const data =
            await apiRequest("/admin/categories");

        const categories =
            Array.isArray(data)
                ? data
                : data.categories || data.data || [];

        if (!categories.length) {

            table.innerHTML = `
                <tr>
                    <td colspan="5">
                        No categories found.
                    </td>
                </tr>
            `;

            return;
        }

        table.innerHTML =
            categories.map(category => {

                const status =
                    String(
                        category.status || "ACTIVE"
                    ).toUpperCase();

                return `
                    <tr>

                        <td>
                            ${category.id ?? "-"}
                        </td>

                        <td>
                            <strong>
                                ${category.name ?? "-"}
                            </strong>
                        </td>

                        <td>
                            ${category.description ?? "-"}
                        </td>

                        <td>
                            <span class="badge">
                                ${status}
                            </span>
                        </td>

                        <td>

                            <select
                                id="status-${category.id}"
                                class="form-control"
                            >
                                <option value="ACTIVE"
                                    ${status === "ACTIVE"
                                        ? "selected"
                                        : ""}>
                                    ACTIVE
                                </option>

                                <option value="INACTIVE"
                                    ${status === "INACTIVE"
                                        ? "selected"
                                        : ""}>
                                    INACTIVE
                                </option>
                            </select>

                            <button
                                class="btn btn-primary"
                                onclick="updateCategory(${category.id})"
                            >
                                Update
                            </button>

                        </td>

                    </tr>
                `;

            }).join("");

    } catch (error) {

        table.innerHTML = `
            <tr>
                <td colspan="5">
                    ${error.message}
                </td>
            </tr>
        `;
    }
}

document
    .getElementById("categoryForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("categoryName").value.trim();

        const description =
            document
                .getElementById("categoryDescription")
                .value.trim();

        try {

            await apiRequest("/admin/categories", {

                method: "POST",

                body: JSON.stringify({
                    name: name,
                    description: description
                })

            });

            showMessage(
                "Category added successfully.",
                "success"
            );

            this.reset();

            loadCategories();

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );
        }
    });

async function updateCategory(id) {

    const status =
        document
            .getElementById(`status-${id}`)
            .value;

    try {

        await apiRequest(
            `/admin/categories/${id}`,
            {
                method: "PUT",
                body: JSON.stringify({
                    status: status
                })
            }
        );

        showMessage(
            "Category updated successfully.",
            "success"
        );

        loadCategories();

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}

function showMessage(message, type) {

    document.getElementById("message").innerHTML = `
        <div class="alert ${type}">
            ${message}
        </div>
    `;

    setTimeout(() => {

        document.getElementById("message").innerHTML = "";

    }, 3000);
}

loadCategories();
</script>

</body>
</html>
