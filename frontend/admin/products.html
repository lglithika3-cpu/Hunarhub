<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container nav-content">
        <a href="dashboard.html" class="logo">HunarHub</a>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="users.html">Users</a>
            <a href="entrepreneurs.html">Entrepreneurs</a>
            <a href="categories.html">Categories</a>
            <a href="products.html">Products</a>
            <a href="services.html">Services</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Requests</a>
            <a href="reviews.html">Reviews</a>
            <a href="reports.html">Reports</a>
            <button onclick="logout()" class="btn btn-danger">Logout</button>
        </div>
    </div>
</nav>

<section class="page-header">
    <div class="container">
        <h1>Product Management</h1>
        <p>Monitor products listed by local entrepreneurs.</p>
    </div>
</section>

<section class="section">
    <div class="container">

        <div id="message"></div>

        <div class="card">

            <div class="section-header">

                <div>
                    <h2>Marketplace Products</h2>
                    <p>Manage product availability.</p>
                </div>

                <button
                    class="btn btn-primary"
                    onclick="loadProducts()"
                >
                    Refresh
                </button>

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Entrepreneur</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="productsTable">
                        <tr>
                            <td colspan="8">
                                Loading...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>
</section>

<script src="../js/app.js"></script>

<script>
async function loadProducts() {

    const table =
        document.getElementById("productsTable");

    try {

        const data =
            await apiRequest("/admin/products");

        const products =
            Array.isArray(data)
                ? data
                : data.products || data.data || [];

        if (!products.length) {

            table.innerHTML = `
                <tr>
                    <td colspan="8">
                        No products found.
                    </td>
                </tr>
            `;

            return;
        }

        table.innerHTML =
            products.map(product => {

                const status =
                    String(
                        product.status || "ACTIVE"
                    ).toUpperCase();

                return `
                    <tr>

                        <td>${product.id ?? "-"}</td>

                        <td>
                            <strong>
                                ${product.name ?? "-"}
                            </strong>
                        </td>

                        <td>
                            ${product.business_name
                                ?? product.entrepreneur_name
                                ?? product.user_name
                                ?? "-"}
                        </td>

                        <td>
                            ${product.category_name
                                ?? "-"}
                        </td>

                        <td>
                            ₹${product.price ?? "0"}
                        </td>

                        <td>
                            ${product.stock ?? "0"}
                        </td>

                        <td>
                            <span class="badge">
                                ${status}
                            </span>
                        </td>

                        <td>

                            <select
                                id="status-${product.id}"
                                class="form-control"
                            >

                                <option value="ACTIVE"
                                    ${status === "ACTIVE"
                                        ? "selected"
                                        : ""}>
                                    ACTIVE
                                </option>

                                <option value="INACTIVE"
                                    ${status === "INACTIVE"
                                        ? "selected"
                                        : ""}>
                                    INACTIVE
                                </option>

                                <option value="OUT_OF_STOCK"
                                    ${status === "OUT_OF_STOCK"
                                        ? "selected"
                                        : ""}>
                                    OUT_OF_STOCK
                                </option>

                            </select>

                            <button
                                class="btn btn-primary"
                                onclick="updateProduct(${product.id})"
                            >
                                Update
                            </button>

                        </td>

                    </tr>
                `;

            }).join("");

    } catch (error) {

        table.innerHTML = `
            <tr>
                <td colspan="8">
                    ${error.message}
                </td>
            </tr>
        `;
    }
}

async function updateProduct(id) {

    const status =
        document
            .getElementById(`status-${id}`)
            .value;

    try {

        await apiRequest(
            `/admin/products/${id}/status`,
            {
                method: "PUT",
                body: JSON.stringify({
                    status: status
                })
            }
        );

        showMessage(
            "Product status updated.",
            "success"
        );

        loadProducts();

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}

function showMessage(message, type) {

    document.getElementById("message").innerHTML = `
        <div class="alert ${type}">
            ${message}
        </div>
    `;

    setTimeout(() => {
        document.getElementById("message").innerHTML = "";
    }, 3000);
}

loadProducts();
</script>

</body>
</html>
