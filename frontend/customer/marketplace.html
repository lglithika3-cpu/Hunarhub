<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-inner">
        <a href="../index.html" class="logo">Hunar<span>Hub</span></a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Services</a>
            <a href="profile.html">Profile</a>
            <button onclick="logout()" class="btn btn-outline">Logout</button>
        </div>
    </div>
</nav>

<main class="dashboard">
    <div class="container">

        <div class="dashboard-header">
            <div>
                <h1>Local Marketplace</h1>
                <p>Discover products and services from local entrepreneurs.</p>
            </div>
        </div>

        <div class="card" style="margin-bottom:30px;">
            <div style="display:grid;grid-template-columns:2fr 1fr;gap:15px;">
                <input
                    type="text"
                    id="search"
                    placeholder="Search local products..."
                    oninput="filterProducts()"
                    style="padding:12px;border:1px solid #e5e7eb;border-radius:9px;"
                >

                <select
                    id="categoryFilter"
                    onchange="filterProducts()"
                    style="padding:12px;border:1px solid #e5e7eb;border-radius:9px;"
                >
                    <option value="">All Categories</option>
                    <option value="Tailor">Tailor</option>
                    <option value="Potter">Potter</option>
                    <option value="Cobbler">Cobbler</option>
                    <option value="Artisan">Artisan</option>
                    <option value="Handmade Products">Handmade Products</option>
                    <option value="Local Vendor">Local Vendor</option>
                </select>
            </div>
        </div>

        <div id="message"></div>

        <div class="product-grid" id="productGrid">
            <div class="card">
                Loading products...
            </div>
        </div>

    </div>
</main>

<script src="../js/app.js"></script>

<script>
let products = [];

const categoryDefinitions = [{"name": "Tailor", "id": 1}, {"name": "Potter", "id": 2}, {"name": "Cobbler", "id": 3}, {"name": "Artisan", "id": 4}, {"name": "Handmade Products", "id": 5}, {"name": "Local Vendor", "id": 6}];

function setupCategoryFilter() {
    const categoryFilter = document.getElementById("categoryFilter");

    if (!categoryFilter) {
        console.error("categoryFilter element not found.");
        return;
    }

    categoryFilter.innerHTML =
        '<option value="">All Categories</option>' +
        categoryDefinitions.map(category =>
            `<option value="${category.id}">${category.name}</option>`
        ).join("");

    categoryFilter.addEventListener("change", filterProducts);

    const searchInput = document.getElementById("search");

    if (searchInput) {
        searchInput.addEventListener("input", filterProducts);
    }
}

async function loadProducts() {
    const grid = document.getElementById("productGrid");

    try {
        const result = await apiRequest("/api/customer/products");

        products = Array.isArray(result)
            ? result
            : (result.products || []);

        console.log("Products loaded:", products.length);

        displayProducts(products);

    } catch (error) {
        console.error("Product loading failed:", error);

        grid.innerHTML = `
            <div class="card">
                <h3>Unable to load products</h3>
                <p>${error.message}</p>
            </div>
        `;
    }
}

function displayProducts(items) {
    const grid = document.getElementById("productGrid");

    if (!items.length) {
        grid.innerHTML = `
            <div class="card">
                <h3>No products found</h3>
                <p>There are currently no matching products.</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = items.map(product => {

        let imageUrl = product.image_url || "";

        if (imageUrl && !imageUrl.startsWith("/")) {
            imageUrl = "/" + imageUrl;
        }

        const imageHtml = imageUrl
            ? `<img src="${imageUrl}" alt="${product.name || "Product"}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='???';">`
            : "???";

        return `
            <div class="product-card">

                <div class="product-image">
                    ${imageHtml}
                </div>

                <div class="product-info">

                    <h3>${product.name || "Unnamed Product"}</h3>

                    <p>
                        ${product.description || "Local product from HunarHub"}
                    </p>

                    <p class="price">
                        ?${product.price || "0"}
                    </p>

                    <p>
                        Stock:
                        <strong>${product.stock ?? 0}</strong>
                    </p>

                    <br>

                    <a
                        href="product.html?id=${product.id}"
                        class="btn btn-primary"
                    >
                        View Product
                    </a>

                </div>
            </div>
        `;
    }).join("");
}

function filterProducts() {

    const searchInput = document.getElementById("search");
    const categoryFilter = document.getElementById("categoryFilter");

    const search = searchInput
        ? searchInput.value.trim().toLowerCase()
        : "";

    const selectedCategoryId = categoryFilter
        ? String(categoryFilter.value || "")
        : "";

    const filtered = products.filter(product => {

        const name = String(
            product.name || ""
        ).trim().toLowerCase();

        const description = String(
            product.description || ""
        ).trim().toLowerCase();

        const matchesSearch =
            !search ||
            name.includes(search) ||
            description.includes(search);

        const matchesCategory =
            !selectedCategoryId ||
            String(product.category_id) === selectedCategoryId;

        return matchesSearch && matchesCategory;
    });

    console.log(
        "Filter:",
        selectedCategoryId || "ALL",
        "Results:",
        filtered.length
    );

    displayProducts(filtered);
}

setupCategoryFilter();
loadProducts();
</script>

</body>
</html>
