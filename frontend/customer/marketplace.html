<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-inner">
        <a href="../index.html" class="logo">Hunar<span>Hub</span></a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Services</a>
            <a href="profile.html">Profile</a>
            <button onclick="logout()" class="btn btn-outline">Logout</button>
        </div>
    </div>
</nav>

<main class="dashboard">
    <div class="container">

        <div class="dashboard-header">
            <div>
                <h1>Local Marketplace</h1>
                <p>Discover products and services from local entrepreneurs.</p>
            </div>
        </div>

        <div class="card" style="margin-bottom:30px;">
            <div style="display:grid;grid-template-columns:2fr 1fr;gap:15px;">
                <input
                    type="text"
                    id="search"
                    placeholder="Search local products..."
                    oninput="filterProducts()"
                    style="padding:12px;border:1px solid #e5e7eb;border-radius:9px;"
                >

                <select
                    id="categoryFilter"
                    onchange="filterProducts()"
                    style="padding:12px;border:1px solid #e5e7eb;border-radius:9px;"
                >
                    <option value="">All Categories</option>
                    <option value="Tailor">Tailor</option>
                    <option value="Potter">Potter</option>
                    <option value="Cobbler">Cobbler</option>
                    <option value="Artisan">Artisan</option>
                    <option value="Handmade Products">Handmade Products</option>
                    <option value="Local Vendor">Local Vendor</option>
                </select>
            </div>
        </div>

        <div id="message"></div>

        <div class="product-grid" id="productGrid">
            <div class="card">
                Loading products...
            </div>
        </div>

    </div>
</main>

<script src="../js/app.js"></script>

<script>
let products = [];

async function loadProducts() {
    const grid = document.getElementById("productGrid");

    try {
        const result = await apiRequest("/api/customer/products");

        products = Array.isArray(result)
            ? result
            : (result.products || []);

        displayProducts(products);

    } catch (error) {
        grid.innerHTML = `
            <div class="card">
                <h3>Unable to load products</h3>
                <p>${error.message}</p>
            </div>
        `;
    }
}

function displayProducts(items) {
    const grid = document.getElementById("productGrid");

    if (!items.length) {
        grid.innerHTML = `
            <div class="card">
                <h3>No products found</h3>
                <p>There are currently no matching products.</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = items.map(product => `
        <div class="product-card">
            <div class="product-image">
                ${product.image_url
                    ? `<img src="${product.image_url}" style="width:100%;height:100%;object-fit:cover;">`
                    : "🛍️"}
            </div>

            <div class="product-info">
                <h3>${product.name || "Unnamed Product"}</h3>

                <p>
                    ${product.description || "Local product from HunarHub"}
                </p>

                <p class="price">
                    ₹${product.price || "0"}
                </p>

                <p>
                    Stock:
                    <strong>${product.stock ?? 0}</strong>
                </p>

                <br>

                <a
                    href="product.html?id=${product.id}"
                    class="btn btn-primary"
                >
                    View Product
                </a>
            </div>
        </div>
    `).join("");
}

function filterProducts() {
    const search = document
        .getElementById("search")
        .value
        .toLowerCase();

    const category = document
        .getElementById("categoryFilter")
        .value
        .toLowerCase();

    const filtered = products.filter(product => {

        const name = String(product.name || "").toLowerCase();
        const description = String(product.description || "").toLowerCase();
        const productCategory = String(
            product.category_name ||
            product.category ||
            ""
        ).toLowerCase();

        const matchesSearch =
            name.includes(search) ||
            description.includes(search);

        const matchesCategory =
            !category ||
            productCategory === category;

        return matchesSearch && matchesCategory;
    });

    displayProducts(filtered);
}

loadProducts();
</script>

</body>
</html>
