<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-inner">
        <a href="../index.html" class="logo">Hunar<span>Hub</span></a>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Services</a>
            <a href="review.html">Reviews</a>
            <a href="profile.html">Profile</a>
            <button onclick="logout()" class="btn btn-outline">Logout</button>
        </div>
    </div>
</nav>

<main class="dashboard">
    <div class="container">

        <div class="dashboard-header">
            <div>
                <h1>My Orders</h1>
                <p>Track your HunarHub purchases.</p>
            </div>

            <a href="marketplace.html" class="btn btn-primary">
                Continue Shopping
            </a>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Entrepreneur</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Review</th>
                    </tr>
                </thead>

                <tbody id="ordersBody">
                    <tr>
                        <td colspan="6">Loading orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<script src="../js/app.js"></script>

<script>
async function loadOrders() {
    const body = document.getElementById("ordersBody");

    try {
        const result = await apiRequest("/customer/orders");

        const orders = Array.isArray(result)
            ? result
            : (result.orders || []);

        if (!orders.length) {
            body.innerHTML = `
                <tr>
                    <td colspan="6">
                        No orders found.
                    </td>
                </tr>
            `;
            return;
        }

        body.innerHTML = orders.map(order => `
            <tr>
                <td>#${order.id}</td>

                <td>
                    ${order.entrepreneur_name ||
                    order.business_name ||
                    "Local Entrepreneur"}
                </td>

                <td>
                    ₹${order.total_amount || 0}
                </td>

                <td>
                    <span class="badge badge-info">
                        ${order.status || "PENDING"}
                    </span>
                </td>

                <td>
                    ${order.created_at || "-"}
                </td>

                <td>
                    <a
                        href="review.html"
                        class="btn btn-outline"
                        style="padding:7px 12px;"
                    >
                        Review
                    </a>
                </td>
            </tr>
        `).join("");

    } catch (error) {
        body.innerHTML = `
            <tr>
                <td colspan="6">
                    ${error.message}
                </td>
            </tr>
        `;
    }
}

loadOrders();
</script>

</body>
</html>
