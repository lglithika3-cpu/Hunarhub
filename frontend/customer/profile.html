<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-inner">
        <a href="../index.html" class="logo">Hunar<span>Hub</span></a>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Services</a>
            <a href="review.html">Reviews</a>
            <a href="profile.html">Profile</a>
            <button onclick="logout()" class="btn btn-outline">Logout</button>
        </div>
    </div>
</nav>

<main class="dashboard">
    <div class="container">

        <div class="dashboard-header">
            <div>
                <h1>My Profile</h1>
                <p>Manage your HunarHub account information.</p>
            </div>
        </div>

        <div class="card">

            <form id="profileForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input
                        type="text"
                        id="phone"
                        name="phone"
                    >
                </div>

                <div class="form-group">
                    <label for="language">Preferred Language</label>
                    <input
                        type="text"
                        id="language"
                        name="language"
                        placeholder="English"
                    >
                </div>

                <div class="form-group">
                    <label>
                        <input
                            type="checkbox"
                            id="location_permission"
                        >
                        Allow location-based services
                    </label>

                    <p class="location-note">
                        Your location is used only to improve local entrepreneur
                        discovery and service matching.
                    </p>
                </div>

                <div id="profileMessage"></div>

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

            </form>

        </div>

    </div>
</main>

<script src="../js/app.js"></script>

<script>
async function loadProfile() {
    try {
        const result = await apiRequest("/customer/profile");

        const profile = result.user || result;

        document.getElementById("name").value =
            profile.name || "";

        document.getElementById("email").value =
            profile.email || "";

        document.getElementById("phone").value =
            profile.phone || "";

        document.getElementById("language").value =
            profile.language || "English";

        document.getElementById("location_permission").checked =
            Boolean(profile.location_permission);

    } catch (error) {
        document.getElementById("profileMessage").innerHTML = `
            <p class="error-message">${error.message}</p>
        `;
    }
}

document.getElementById("profileForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("profileMessage");

    const data = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        language: document.getElementById("language").value.trim(),
        location_permission:
            document.getElementById("location_permission").checked
    };

    try {
        await apiRequest("/customer/profile", {
            method: "PUT",
            body: JSON.stringify(data)
        });

        message.innerHTML = `
            <p class="success-message">
                Profile updated successfully.
            </p>
        `;

    } catch (error) {
        message.innerHTML = `
            <p class="error-message">
                ${error.message}
            </p>
        `;
    }
});

loadProfile();
</script>

</body>
</html>
