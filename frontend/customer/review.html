<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-inner">
        <a href="../index.html" class="logo">Hunar<span>Hub</span></a>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Services</a>
            <a href="review.html">Reviews</a>
            <a href="profile.html">Profile</a>
            <button onclick="logout()" class="btn btn-outline">Logout</button>
        </div>
    </div>
</nav>

<main class="dashboard">
    <div class="container">

        <div class="dashboard-header">
            <div>
                <h1>Reviews</h1>
                <p>Share your experience with local entrepreneurs.</p>
            </div>
        </div>

        <div class="card">
            <h2>Write a Review</h2>

            <form id="reviewForm">

                <div class="form-group">
                    <label for="entrepreneur_id">Entrepreneur ID</label>
                    <input
                        type="number"
                        id="entrepreneur_id"
                        required
                        value="2"
                    >
                </div>

                <div class="form-group">
                    <label for="product_id">Product ID</label>
                    <input
                        type="number"
                        id="product_id"
                        value="1"
                    >
                </div>

                <div class="form-group">
                    <label for="rating">Rating</label>

                    <select id="rating" required>
                        <option value="">Select Rating</option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Very Good</option>
                        <option value="3">3 - Good</option>
                        <option value="2">2 - Fair</option>
                        <option value="1">1 - Poor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="review_text">Your Review</label>

                    <textarea
                        id="review_text"
                        rows="5"
                        placeholder="Write your experience..."
                        required
                    ></textarea>
                </div>

                <div id="reviewMessage"></div>

                <button type="submit" class="btn btn-primary">
                    Submit Review
                </button>

            </form>
        </div>

        <div class="card" style="margin-top: 25px;">
            <h2>My Submitted Reviews</h2>

            <div id="reviewsContainer">
                Loading reviews...
            </div>
        </div>

    </div>
</main>

<script src="../js/app.js"></script>

<script>
async function loadReviews() {
    const container = document.getElementById("reviewsContainer");

    try {
        const result = await apiRequest("/customer/reviews");

        const reviews = Array.isArray(result)
            ? result
            : (result.reviews || []);

        if (!reviews.length) {
            container.innerHTML = `
                <p>No reviews submitted yet.</p>
            `;
            return;
        }

        container.innerHTML = reviews.map(review => `
            <div class="card" style="margin-top: 15px;">
                <h3>
                    ${review.entrepreneur_name ||
                    review.business_name ||
                    "Local Entrepreneur"}
                </h3>

                <p>
                    <strong>Rating:</strong>
                    ${review.rating}/5
                </p>

                <p>
                    ${review.review_text || "-"}
                </p>

                <small>
                    ${review.created_at || ""}
                </small>
            </div>
        `).join("");

    } catch (error) {
        container.innerHTML = `
            <p class="error-message">
                ${error.message}
            </p>
        `;
    }
}

document.getElementById("reviewForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("reviewMessage");

    const data = {
        entrepreneur_id: Number(
            document.getElementById("entrepreneur_id").value
        ),
        product_id: Number(
            document.getElementById("product_id").value
        ),
        rating: Number(
            document.getElementById("rating").value
        ),
        review_text:
            document.getElementById("review_text").value.trim()
    };

    try {
        await apiRequest("/customer/reviews", {
            method: "POST",
            body: JSON.stringify(data)
        });

        message.innerHTML = `
            <p class="success-message">
                Review submitted successfully.
            </p>
        `;

        document.getElementById("reviewForm").reset();

        loadReviews();

    } catch (error) {
        message.innerHTML = `
            <p class="error-message">
                ${error.message}
            </p>
        `;
    }
});

loadReviews();
</script>

</body>
</html>
