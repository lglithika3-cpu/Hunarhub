<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-inner">
        <a href="../index.html" class="logo">Hunar<span>Hub</span></a>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="products.html">Products</a>
            <a href="services.html">Services</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Requests</a>
            <a href="earnings.html">Earnings</a>
            <button onclick="logout()" class="btn btn-outline">Logout</button>
        </div>
    </div>
</nav>

<main class="dashboard">
    <div class="container">

        <div class="dashboard-header">
            <div>
                <h1>My Products</h1>
                <p>Add, update and manage the products you offer on HunarHub.</p>
            </div>
        </div>

        <div class="card">

            <h2>Add New Product</h2>

            <form id="productForm">

                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input type="number" id="price" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" id="stock" min="0" required>
                </div>

                <div class="form-group">
                    <label>Category ID</label>
                    <input type="number" id="category_id" min="1" required>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="image_url">
                </div>

                <div id="productMessage"></div>

                <button type="submit" class="btn btn-primary">
                    Add Product
                </button>

            </form>

        </div>

        <div class="section">

            <div class="section-header">
                <h2>My Product List</h2>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="productTableBody">
                        <tr>
                            <td colspan="7">Loading products...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>
</main>

<script src="../js/app.js"></script>

<script>

async function loadProducts() {

    const tableBody = document.getElementById("productTableBody");

    try {

        const result = await apiRequest("/entrepreneur/products");

        const products = result.products || result;

        tableBody.innerHTML = "";

        if (!Array.isArray(products) || products.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7">
                        No products found.
                    </td>
                </tr>
            `;

            return;
        }

        products.forEach(product => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${product.id ?? "-"}</td>

                <td>
                    <strong>${product.name ?? "-"}</strong>
                    <br>
                    <small>${product.description ?? ""}</small>
                </td>

                <td>${product.category_name ?? product.category_id ?? "-"}</td>

                <td>₹${product.price ?? "0"}</td>

                <td>${product.stock ?? "0"}</td>

                <td>
                    <span class="badge">
                        ${product.status ?? "ACTIVE"}
                    </span>
                </td>

                <td>
                    <button
                        class="btn btn-outline"
                        onclick="deleteProduct(${product.id})">
                        Deactivate
                    </button>
                </td>
            `;

            tableBody.appendChild(row);

        });

    } catch (error) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="7">
                    ${error.message}
                </td>
            </tr>
        `;

    }
}


document.getElementById("productForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const message = document.getElementById("productMessage");

        const data = {

            name:
                document.getElementById("name").value.trim(),

            description:
                document.getElementById("description").value.trim(),

            price:
                Number(document.getElementById("price").value),

            stock:
                Number(document.getElementById("stock").value),

            category_id:
                Number(document.getElementById("category_id").value),

            image_url:
                document.getElementById("image_url").value.trim()

        };

        try {

            await apiRequest("/entrepreneur/products", {

                method: "POST",

                body: JSON.stringify(data)

            });

            message.innerHTML = `
                <p class="success-message">
                    Product added successfully.
                </p>
            `;

            document.getElementById("productForm").reset();

            loadProducts();

        } catch (error) {

            message.innerHTML = `
                <p class="error-message">
                    ${error.message}
                </p>
            `;

        }

    }
);


async function deleteProduct(productId) {

    const confirmed = confirm(
        "Are you sure you want to deactivate this product?"
    );

    if (!confirmed) {
        return;
    }

    try {

        await apiRequest(
            `/entrepreneur/products/${productId}`,
            {
                method: "DELETE"
            }
        );

        loadProducts();

    } catch (error) {

        alert(error.message);

    }

}


loadProducts();

</script>

</body>
</html>
