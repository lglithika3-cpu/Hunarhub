<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrepreneur Profile | HunarHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container navbar-inner">
        <a href="../index.html" class="logo">Hunar<span>Hub</span></a>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="products.html">Products</a>
            <a href="services.html">Services</a>
            <a href="orders.html">Orders</a>
            <a href="service-requests.html">Requests</a>
            <a href="earnings.html">Earnings</a>
            <button onclick="logout()" class="btn btn-outline">Logout</button>
        </div>
    </div>
</nav>

<main class="dashboard">
    <div class="container">

        <div class="dashboard-header">
            <div>
                <h1>Business Profile</h1>
                <p>Manage your HunarHub entrepreneur profile.</p>
            </div>
        </div>

        <div class="card">

            <form id="profileForm">

                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text" id="business_name" required>
                </div>

                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="bio" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label>Skills</label>
                    <textarea id="skill_description" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label>Experience</label>
                    <input type="text" id="experience">
                </div>

                <div class="form-group">
                    <label>Area</label>
                    <input type="text" id="address_area">
                </div>

                <div class="form-group">
                    <label>Latitude</label>
                    <input type="number" step="any" id="latitude">
                </div>

                <div class="form-group">
                    <label>Longitude</label>
                    <input type="number" step="any" id="longitude">
                </div>

                <div class="form-group">
                    <label>Location Visibility</label>

                    <select id="location_visibility">
                        <option value="EXACT">Exact</option>
                        <option value="AREA_ONLY">Area Only</option>
                        <option value="HIDDEN">Hidden</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="availability_status">
                        Available for new customers
                    </label>
                </div>

                <div id="profileMessage"></div>

                <button type="submit" class="btn btn-primary">
                    Save Profile
                </button>

            </form>

        </div>

    </div>
</main>

<script src="../js/app.js"></script>

<script>
async function loadProfile() {
    try {
        const result = await apiRequest("/entrepreneur/profile");

        const profile = result.entrepreneur || result;

        document.getElementById("business_name").value =
            profile.business_name || "";

        document.getElementById("bio").value =
            profile.bio || "";

        document.getElementById("skill_description").value =
            profile.skill_description || "";

        document.getElementById("experience").value =
            profile.experience || "";

        document.getElementById("address_area").value =
            profile.address_area || "";

        document.getElementById("latitude").value =
            profile.latitude ?? "";

        document.getElementById("longitude").value =
            profile.longitude ?? "";

        document.getElementById("location_visibility").value =
            profile.location_visibility || "AREA_ONLY";

        document.getElementById("availability_status").checked =
            Boolean(profile.availability_status);

    } catch (error) {

        document.getElementById("profileMessage").innerHTML = `
            <p class="error-message">${error.message}</p>
        `;
    }
}

document.getElementById("profileForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const message = document.getElementById("profileMessage");

    const data = {
        business_name:
            document.getElementById("business_name").value.trim(),

        bio:
            document.getElementById("bio").value.trim(),

        skill_description:
            document.getElementById("skill_description").value.trim(),

        experience:
            document.getElementById("experience").value.trim(),

        address_area:
            document.getElementById("address_area").value.trim(),

        latitude:
            document.getElementById("latitude").value
                ? Number(document.getElementById("latitude").value)
                : null,

        longitude:
            document.getElementById("longitude").value
                ? Number(document.getElementById("longitude").value)
                : null,

        location_visibility:
            document.getElementById("location_visibility").value,

        availability_status:
            document.getElementById("availability_status").checked
    };

    try {

        await apiRequest("/entrepreneur/profile", {
            method: "PUT",
            body: JSON.stringify(data)
        });

        message.innerHTML = `
            <p class="success-message">
                Profile updated successfully.
            </p>
        `;

    } catch (error) {

        message.innerHTML = `
            <p class="error-message">
                ${error.message}
            </p>
        `;
    }
});

loadProfile();
</script>

</body>
</html>
